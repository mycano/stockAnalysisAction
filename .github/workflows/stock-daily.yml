# ============================================================
#  stock-daily.yml —— 每日投研自动化（最终完整版）
# ------------------------------------------------------------
#  怎么改自选标的：
#    进仓库 Settings → Secrets and variables → Actions → Variables
#    建三条变量（值改成你自己的，逗号分隔，不带引号）：
#      STOCK_LIST = 600519,000858,300750,00700.HK,AAPL,NVDA
#      ETF_LIST   = 510300,159915,518880
#      FUND_LIST  = 161725,110011,001511
#    改完下次运行自动生效，不用动这个文件。
#
#  怎么手动跑：
#    Actions 页面 → 左侧点这个 workflow → 右上 Run workflow
#
#  定时：北京时间 16:00（周一到周五）自动跑
# ============================================================

name: 每日投研

on:
  # 北京时间 16:00 = UTC 08:00，仅工作日
  schedule:
    - cron: '0 8 * * 1-5'
  # 允许网页上手动点按钮触发
  workflow_dispatch:
    inputs:
      depth:
        description: '分析深度 quick / standard / deep'
        required: false
        default: 'standard'

# 权限：写 Issue + 读仓库内容（gh 命令需要）
permissions:
  issues: write
  contents: read

env:
  TZ: Asia/Shanghai
  # 以下仅在 Variables 未设置时生效
  DEFAULT_STOCK_LIST: "600519,300750,00700.HK,AAPL,NVDA"
  DEFAULT_ETF_LIST:   "510300,518880"
  DEFAULT_FUND_LIST:  "161725,110011"

jobs:
  # ======================== 第 1 步：市场复盘 ========================
  market-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      date:  ${{ steps.meta.outputs.date }}
      runid: ${{ steps.meta.outputs.runid }}
    steps:
      # 拉取仓库代码（gh 命令需要）
      - uses: actions/checkout@v4

      # 装 Python（用来跑 pip 装 CLI）
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 装投研 CLI（young-stock-cli 或 stock-analysis 二选一）
      - name: 安装投研工具
        run: |
          pip install -q young-stock-cli 2>/dev/null \
            || pip install -q stock-analysis 2>/dev/null \
            || echo "WARN: 未装到 CLI，后续会跳过分析"
          echo "--- 可用命令 ---"
          command -v young         && echo "✅ young"
          command -v stock-analysis && echo "✅ stock-analysis"

      # 记录日期和 run id，供后续步骤用
      - name: 记录元信息
        id: meta
        run: |
          DATE=$(date +%F)
          echo "date=$DATE"        >> $GITHUB_OUTPUT
          echo "runid=${{ github.run_id }}" >> $GITHUB_OUTPUT
          mkdir -p reports/market
          echo "📅 今日日期: $DATE"

      # A 股盘后
      - name: A股盘后复盘
        continue-on-error: true
        run: |
          DATE=${{ steps.meta.outputs.date }}
          if command -v young &> /dev/null; then
            young daily --only A股 --quick > reports/market/A股_${DATE}.md 2>&1 || true
          elif command -v stock-analysis &> /dev/null; then
            stock-analysis --market daily --only A股 --quick > reports/market/A股_${DATE}.md 2>&1 || true
          else
            echo "_CLI 未安装，跳过 A股复盘_" > reports/market/A股_${DATE}.md
          fi
          echo "✅ A股复盘完成"

      # 全球市场
      - name: 全球市场快照
        continue-on-error: true
        run: |
          DATE=${{ steps.meta.outputs.date }}
          if command -v young &> /dev/null; then
            young daily --only 全球 --quick > reports/market/全球_${DATE}.md 2>&1 || true
          elif command -v stock-analysis &> /dev/null; then
            stock-analysis --market daily --only 全球 --quick > reports/market/全球_${DATE}.md 2>&1 || true
          else
            echo "_CLI 未安装，跳过全球快照_" > reports/market/全球_${DATE}.md
          fi
          echo "✅ 全球快照完成"

  # ======================== 第 2 步：个股/ETF/基金分析 ========================
  deep-dive:
    needs: market-recap
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装投研工具
        run: |
          pip install -q young-stock-cli 2>/dev/null \
            || pip install -q stock-analysis 2>/dev/null || true

      # 读配置：优先用 Variables，没有就 fallback 到文件顶部 env 里的默认值
      - name: 读取自选标的配置
        id: cfg
        run: |
          STOCKS="${{ vars.STOCK_LIST || env.DEFAULT_STOCK_LIST }}"
          ETFS="${{ vars.ETF_LIST   || env.DEFAULT_ETF_LIST }}"
          FUNDS="${{ vars.FUND_LIST  || env.DEFAULT_FUND_LIST }}"
          echo "📋 股票: $STOCKS"
          echo "📋 ETF:   $ETFS"
          echo "📋 基金:  $FUNDS"
          jq -n \
            --arg s "$STOCKS" --arg e "$ETFS" --arg f "$FUNDS" \
            '{stocks: ($s | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(.!=""))),
              etfs:   ($e | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(.!=""))),
              funds:  ($f | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(.!="")))}' \
            > /tmp/cfg.json
          echo "--- 配置 JSON ---"
          cat /tmp/cfg.json

      # 分析股票
      - name: 分析股票
        continue-on-error: true
        run: |
          DEPTH="${{ github.event.inputs.depth || 'standard' }}"
          DATE=${{ needs.market-recap.outputs.date }}
          mkdir -p reports/stocks
          CLI=$(command -v young || command -v stock-analysis)
          if [ -z "$CLI" ]; then echo "⚠️ 无 CLI，跳过"; exit 0; fi
          jq -r '.stocks[]' /tmp/cfg.json | while read -r sym; do
            [ -z "$sym" ] && continue
            echo "==== 📈 分析 $sym ($DEPTH) ===="
            safe=$(echo "$sym" | tr -d '.')
            "$CLI" --market research --symbol "$sym" --asset-type company --depth "$DEPTH" \
              > "reports/stocks/${safe}_${DATE}.md" 2> "reports/stocks/${safe}_err.log" \
              || echo "  ⚠️ $sym 失败，见 err.log"
          done

      # 分析 ETF
      - name: 分析 ETF
        continue-on-error: true
        run: |
          DEPTH="${{ github.event.inputs.depth || 'standard' }}"
          DATE=${{ needs.market-recap.outputs.date }}
          mkdir -p reports/etfs
          CLI=$(command -v young || command -v stock-analysis)
          if [ -z "$CLI" ]; then echo "⚠️ 无 CLI，跳过"; exit 0; fi
          jq -r '.etfs[]' /tmp/cfg.json | while read -r sym; do
            [ -z "$sym" ] && continue
            echo "==== 🧩 分析 $sym ===="
            safe=$(echo "$sym" | tr -d '.')
            "$CLI" --market research --symbol "$sym" --asset-type etf --depth "$DEPTH" \
              > "reports/etfs/${safe}_${DATE}.md" 2>&1 || true
          done

      # 分析基金
      - name: 分析基金
        continue-on-error: true
        run: |
          DATE=${{ needs.market-recap.outputs.date }}
          mkdir -p reports/funds
          CLI=$(command -v young || command -v stock-analysis)
          if [ -z "$CLI" ]; then echo "⚠️ 无 CLI，跳过"; exit 0; fi
          jq -r '.funds[]' /tmp/cfg.json | while read -r sym; do
            [ -z "$sym" ] && continue
            echo "==== 🏦 分析 $sym ===="
            safe=$(echo "$sym" | tr -d '.')
            "$CLI" --market research --symbol "$sym" --asset-type fund \
              > "reports/funds/${safe}_${DATE}.md" 2>&1 || true
          done

  # ======================== 第 3 步：汇总 + 写 Issue + 传 Artifact ========================
  summarize:
    needs: [market-recap, deep-dive]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 拼出今日摘要（写进 reports/digest.md）
      - name: 生成今日摘要
        id: digest
        run: |
          DATE=${{ needs.market-recap.outputs.date }}
          mkdir -p reports
          {
            echo "## 📊 投研日报 $DATE (run ${{ needs.market-recap.outputs.runid }})"
            echo ""

            echo "<details><summary>📈 A股盘后</summary>"
            echo ""
            [ -f "reports/market/A股_${DATE}.md" ] && head -n 60 "reports/market/A股_${DATE}.md" || echo "_本次未生成_"
            echo ""
            echo "</details>"
            echo ""

            echo "<details><summary>🌐 全球快照</summary>"
            echo ""
            [ -f "reports/market/全球_${DATE}.md" ] && head -n 40 "reports/market/全球_${DATE}.md" || echo "_本次未生成_"
            echo ""
            echo "</details>"
            echo ""

            echo "### 📈 股票"
            for f in reports/stocks/*_${DATE}.md; do
              [ -f "$f" ] || continue
              sym=$(basename "$f" | sed "s/_${DATE}.md//")
              echo "#### $sym"
              echo '```text'
              head -n 50 "$f"
              echo '```'
              echo ""
            done

            echo "### 🧩 ETF"
            for f in reports/etfs/*_${DATE}.md; do
              [ -f "$f" ] || continue
              sym=$(basename "$f" | sed "s/_${DATE}.md//")
              echo "#### $sym"
              echo '```text'
              head -n 40 "$f"
              echo '```'
              echo ""
            done

            echo "### 🏦 基金"
            for f in reports/funds/*_${DATE}.md; do
              [ -f "$f" ] || continue
              sym=$(basename "$f" | sed "s/_${DATE}.md//")
              echo "#### $sym"
              echo '```text'
              head -n 40 "$f"
              echo '```'
              echo ""
            done
          } > reports/digest.md
          echo "✅ 摘要已生成: reports/digest.md"
          echo "--- 摘要预览（前 20 行）---"
          head -20 reports/digest.md

      # 上传完整报告（保留 30 天）
      - name: 上传完整证据包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-reports-${{ needs.market-recap.outputs.date }}-${{ needs.market-recap.outputs.runid }}
          path: reports/
          retention-days: 30

      # ========== 关键修复：用 gh CLI 操作 Issue（不依赖任何第三方 Action）==========
      # 原理：
      #   1) gh issue list --json number -q '.[0].number'  查已存在的日报 Issue 编号
      #   2) 如果没查到，gh issue create 创建，它会在 stdout 打印 URL（含编号）
      #   3) 用 sed 从 URL 里抠出纯数字编号
      #   4) gh issue comment <编号> --body-file 追加今日摘要
      - name: 查找或创建日报 Issue
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1) 查找标题匹配的开放 Issue
          ISSUE_NUM=$(gh issue list --search "投研日报" --state open --json number -q '.[0].number // empty')
          echo "查找结果: '$ISSUE_NUM'"

          # 2) 没找到就创建
          if [ -z "$ISSUE_NUM" ]; then
            echo "未找到日报 Issue，正在创建..."
            URL=$(gh issue create \
              --title "📈 投研日报（每日自动追加）" \
              --body  "由 GitHub Actions 自动维护，每天盘后把摘要追加到评论里。" \
              --label "research,automated")
            echo "创建返回: $URL"
            # 从 URL 末尾抠出数字编号（URL 形如 https://.../issues/7）
            ISSUE_NUM=$(echo "$URL" | sed 's|.*/||')
          fi

          echo "✅ 日报 Issue 编号: $ISSUE_NUM"
          echo "issue_number=$ISSUE_NUM" >> $GITHUB_OUTPUT

      - name: 追加今日摘要到 Issue 评论
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 把 digest.md 的内容作为评论追加到 Issue
          gh issue comment ${{ steps.find.outputs.issue_number }} \
            --body-file reports/digest.md
          echo "✅ 摘要已追加到 Issue #${{ steps.find.outputs.issue_number }}"

      - name: 失败时发告警评论
        if: needs.deep-dive.result == 'failure' || needs.market-recap.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ steps.find.outputs.issue_number }} \
            --body "### ⚠️ ${{ needs.market-recap.outputs.date }} 运行异常
部分标的分析失败，请查看 workflow log 与 Artifact。"
          echo "⚠️ 已发失败告警"
