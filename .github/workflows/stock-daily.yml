# ============================================================
#  stock-daily.yml —— 超简化版（确保能跑通）
# ------------------------------------------------------------
#  只做三件事：
#    1) 跑市场复盘
#    2) 跑自选标的分析
#    3) 把结果写成 Issue 评论
#
#  零第三方 Action 依赖，全部用官方 gh 命令
#  自选标的在 Settings → Variables 里改：
#    STOCK_LIST / ETF_LIST / FUND_LIST
# ============================================================

name: 每日投研

on:
  schedule:
    - cron: '0 8 * * 1-5'   # 北京时间 16:00，周一至周五
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  # ======================== 分析 + 汇总（单个 job，最简单）========================
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 第 1 步：拉取仓库代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 第 2 步：装 Python 和投研工具
      - name: 安装环境
        run: |
          sudo apt-get update -qq
          pip install -q young-stock-cli 2>/dev/null || pip install -q stock-analysis 2>/dev/null || true
          echo "--- 检查 CLI ---"
          command -v young         && echo "✅ young 已安装"         || echo "⚠️ young 未安装"
          command -v stock-analysis && echo "✅ stock-analysis 已安装" || echo "⚠️ stock-analysis 未安装"

      # 第 3 步：跑市场复盘
      - name: 市场复盘
        continue-on-error: true
        run: |
          DATE=$(date +%F)
          mkdir -p reports
          echo "## 📊 投研日报 $DATE" > reports/digest.md
          echo "" >> reports/digest.md

          echo "### 📈 A股盘后" >> reports/digest.md
          if command -v young &> /dev/null; then
            young daily --only A股 --quick >> reports/digest.md 2>&1 || true
          elif command -v stock-analysis &> /dev/null; then
            stock-analysis --market daily --only A股 --quick >> reports/digest.md 2>&1 || true
          else
            echo "_CLI 未安装_" >> reports/digest.md
          fi
          echo "" >> reports/digest.md

          echo "### 🌐 全球快照" >> reports/digest.md
          if command -v young &> /dev/null; then
            young daily --only 全球 --quick >> reports/digest.md 2>&1 || true
          elif command -v stock-analysis &> /dev/null; then
            stock-analysis --market daily --only 全球 --quick >> reports/digest.md 2>&1 || true
          else
            echo "_CLI 未安装_" >> reports/digest.md
          fi
          echo "" >> reports/digest.md
          echo "✅ 市场复盘完成"

      # 第 4 步：跑自选标的（股票 + ETF + 基金）
      - name: 分析自选标的
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%F)
          mkdir -p reports

          # 读配置：Variables > 默认值
          STOCKS="${{ vars.STOCK_LIST }}"
          ETFS="${{ vars.ETF_LIST }}"
          FUNDS="${{ vars.FUND_LIST }}"
          [ -z "$STOCKS" ] && STOCKS="600519,300750,AAPL,NVDA"
          [ -z "$ETFS" ]   && ETFS="510300"
          [ -z "$FUNDS" ]  && FUNDS="161725"

          echo "📋 股票: $STOCKS"
          echo "📋 ETF: $ETFS"
          echo "📋 基金: $FUNDS"

          CLI=$(command -v young || command -v stock-analysis)
          if [ -z "$CLI" ]; then
            echo "⚠️ 没有可用的 CLI，跳过标的分析"
            echo "### ⚠️ 标的分析跳过" >> reports/digest.md
            echo "_未检测到 young 或 stock-analysis 命令_" >> reports/digest.md
            exit 0
          fi

          echo "### 📈 股票分析" >> reports/digest.md
          echo "$STOCKS" | tr ',' '\n' | while read -r sym; do
            sym=$(echo "$sym" | xargs)
            [ -z "$sym" ] && continue
            echo "  → 分析 $sym ..."
            echo "#### $sym" >> reports/digest.md
            "$CLI" --market research --symbol "$sym" --asset-type company --depth standard >> reports/digest.md 2>&1 || echo "    ⚠️ $sym 失败"
            echo "" >> reports/digest.md
          done

          echo "### 🧩 ETF 分析" >> reports/digest.md
          echo "$ETFS" | tr ',' '\n' | while read -r sym; do
            sym=$(echo "$sym" | xargs)
            [ -z "$sym" ] && continue
            echo "  → 分析 $sym ..."
            echo "#### $sym" >> reports/digest.md
            "$CLI" --market research --symbol "$sym" --asset-type etf --depth quick >> reports/digest.md 2>&1 || true
            echo "" >> reports/digest.md
          done

          echo "### 🏦 基金分析" >> reports/digest.md
          echo "$FUNDS" | tr ',' '\n' | while read -r sym; do
            sym=$(echo "$sym" | xargs)
            [ -z "$sym" ] && continue
            echo "  → 分析 $sym ..."
            echo "#### $sym" >> reports/digest.md
            "$CLI" --market research --symbol "$sym" --asset-type fund >> reports/digest.md 2>&1 || true
            echo "" >> reports/digest.md
          done

          echo "✅ 标的分析完成"

      # 第 5 步：查找或创建日报 Issue（用 gh CLI，不用任何第三方 Action）
      - name: 查找或创建日报 Issue
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 查找已存在的日报 Issue（用 gh issue list，支持 --json）
          ISSUE_NUM=$(gh issue list --search "投研日报" --state open --json number -q '.[0].number // empty')
          echo "查找结果: '$ISSUE_NUM'"

          # 没找到就创建（gh issue create 不支持 --json，直接打印 URL）
          if [ -z "$ISSUE_NUM" ]; then
            echo "未找到，正在创建..."
            URL=$(gh issue create \
              --title "投研日报" \
              --body "由 GitHub Actions 自动维护，每天盘后追加摘要。")
            echo "创建返回: $URL"
            # 从 URL 末尾抠出数字编号
            ISSUE_NUM=$(echo "$URL" | grep -o '[0-9]\+$')
          fi

          echo "✅ Issue 编号: $ISSUE_NUM"
          echo "issue_number=$ISSUE_NUM" >> $GITHUB_OUTPUT

      # 第 6 步：追加今日摘要到 Issue 评论
      - name: 追加摘要到 Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📤 正在发送摘要到 Issue #${{ steps.find.outputs.issue_number }} ..."
          gh issue comment ${{ steps.find.outputs.issue_number }} --body-file reports/digest.md
          echo "✅ 摘要已发送"

      # 第 7 步：上传完整报告（保留 7 天）
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: reports/
          retention-days: 7
