name: 每日投研 (AdvancingTitans stock-analysis)

# ============================================================
# 最终版 · 怎么改自选标的
# ------------------------------------------------------------
# ① 打开仓库 Settings → Secrets and variables → Actions → Variables
# ② 新建下面三个变量（值改成你自己的池子，逗号分隔）：
#
#    STOCK_LIST  → 股票，例：600519,000858,300750,00700.HK,09988.HK,AAPL,NVDA
#    ETF_LIST    → ETF， 例：510300,159915,518880
#    FUND_LIST   → 场外基金，例：161725,110011,001511
#
# ③ workflow 会自动识别类型并跑对应命令；不想分类就全塞 STOCK_LIST 也行
# ④ 手动触发时可在 Actions 页面覆盖标的/深度
# ============================================================

on:
  # 北京时间 16:00 (A股盘后) 周一至周五；UTC = 08:00
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      symbols:
        description: '标的，逗号分隔 (覆盖变量配置)'
        required: false
        default: ''
      depth:
        description: '深度 quick / standard / deep'
        required: false
        default: 'standard'

permissions:
  issues: write
  contents: read

env:
  TZ: Asia/Shanghai
  STOCK_HOME: /github/workspace/.young_stock
  # 默认值（仓库 Variables 未设置时使用）
  DEFAULT_STOCK_LIST: "600519,300750,00700.HK,AAPL,NVDA"
  DEFAULT_ETF_LIST:   "510300,518880"
  DEFAULT_FUND_LIST:  "161725,110011"

jobs:
  # ========================== Job 1: 盘后市场复盘 ==========================
  market-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      date:  ${{ steps.meta.outputs.date }}
      runid: ${{ steps.meta.outputs.runid }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"
          enable-cache: true

      - name: Install young-stock-cli
        run: |
          uv tool install young-stock-cli
          uv tool run young --help | head -5

      - name: Meta
        id: meta
        run: |
          DATE=$(date +%F)
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "runid=${{ github.run_id }}" >> $GITHUB_OUTPUT
          mkdir -p reports/market

      - name: A股盘后复盘
        continue-on-error: true
        run: |
          DATE=${{ steps.meta.outputs.date }}
          uv tool run young daily --only A股 --quick \
            > reports/market/A股_${DATE}.md 2>&1 || true

      - name: 全球市场快照
        continue-on-error: true
        run: |
          DATE=${{ steps.meta.outputs.date }}
          uv tool run young daily --only 全球 --quick \
            > reports/market/全球_${DATE}.md 2>&1 || true

  # ========================== Job 2: 自选标的分析 ==========================
  deep-dive:
    needs: market-recap
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"
          enable-cache: true

      - name: Install young-stock-cli
        run: uv tool install young-stock-cli

      # ---------- 读取配置：手动输入 > Variables > 默认值 ----------
      - name: Resolve config
        id: cfg
        run: |
          # 手动触发时优先用 inputs
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            echo "mode=manual" >> $GITHUB_OUTPUT
            echo "${{ github.event.inputs.symbols }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | jq -R . | jq -s '{stocks:., etfs:[], funds:[]}' > /tmp/cfg.json
          else
            echo "mode=var" >> $GITHUB_OUTPUT
            STOCKS="${{ vars.STOCK_LIST || env.DEFAULT_STOCK_LIST }}"
            ETFS="${{ vars.ETF_LIST || env.DEFAULT_ETF_LIST }}"
            FUNDS="${{ vars.FUND_LIST || env.DEFAULT_FUND_LIST }}"
            jq -n \
              --arg s "$STOCKS" --arg e "$ETFS" --arg f "$FUNDS" \
              '{stocks: ($s | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(.!=""))),
                etfs:   ($e | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(.!=""))),
                funds:  ($f | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(.!="")))}' \
              > /tmp/cfg.json
          fi
          cat /tmp/cfg.json

      # ---------- 自动判别 asset-type 并跑分析 ----------
      - name: Analyze stocks
        id: run-stocks
        continue-on-error: true
        run: |
          DEPTH="${{ github.event.inputs.depth || 'standard' }}"
          DATE=${{ needs.market-recap.outputs.date }}
          mkdir -p reports/stocks
          jq -r '.stocks[]' /tmp/cfg.json | while read -r sym; do
            [ -z "$sym" ] && continue
            echo "==== 📈 STOCK $sym ($DEPTH) ===="
            case "$DEPTH" in
              quick)    FLAG="" ;;
              standard) FLAG="--llm" ;;
              deep)     FLAG="--llm --lens buffett,munger,duan" ;;
              *)        FLAG="--llm" ;;
            esac
            safe=$(echo "$sym" | tr -d '.')
            uv tool run young stock "$sym" $FLAG \
              > "reports/stocks/${safe}_${DATE}.md" 2> "reports/stocks/${safe}_err.log" \
              || echo "WARN: $sym failed"
          done

      - name: Analyze ETFs
        id: run-etfs
        continue-on-error: true
        run: |
          DEPTH="${{ github.event.inputs.depth || 'standard' }}"
          DATE=${{ needs.market-recap.outputs.date }}
          mkdir -p reports/etfs
          jq -r '.etfs[]' /tmp/cfg.json | while read -r sym; do
            [ -z "$sym" ] && continue
            echo "==== 🧩 ETF $sym ($DEPTH) ===="
            safe=$(echo "$sym" | tr -d '.')
            # ETF 用 research + asset-type etf；quick 模式直接 snapshot
            if [ "$DEPTH" = "quick" ]; then
              uv tool run young stock-snapshot "$sym" \
                > "reports/etfs/${safe}_${DATE}.md" 2>&1 || true
            else
              uv tool run young stock "$sym" --asset-type etf $FLAG \
                > "reports/etfs/${safe}_${DATE}.md" 2>&1 || true
            fi
          done

      - name: Analyze funds
        id: run-funds
        continue-on-error: true
        run: |
          DATE=${{ needs.market-recap.outputs.date }}
          mkdir -p reports/funds
          jq -r '.funds[]' /tmp/cfg.json | while read -r sym; do
            [ -z "$sym" ] && continue
            echo "==== 🏦 FUND $sym ===="
            safe=$(echo "$sym" | tr -d '.')
            # 基金用 research + asset-type fund；场外基金 NAV 通常晚间更新
            uv tool run young stock "$sym" --asset-type fund \
              > "reports/funds/${safe}_${DATE}.md" 2>&1 \
              || echo "WARN: fund $sym failed"
          done

  # ========================== Job 3: 汇总 + Issue + Artifact ==========================
  summarize:
    needs: [market-recap, deep-dive]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download reports from previous jobs
        uses: actions/download-artifact@v4
        with:
          path: reports-incoming
        continue-on-error: true

      # 把分类目录里的报告各自取摘要
      - name: Build daily digest
        id: digest
        run: |
          DATE=${{ needs.market-recap.outputs.date }}
          mkdir -p reports
          {
            echo "## 📊 投研日报 $DATE (run ${{ needs.market-recap.outputs.runid }})"
            echo ""

            echo "<details><summary>📈 A股盘后</summary>"
            echo ""
            [ -f "reports/market/A股_${DATE}.md" ] && head -n 60 "reports/market/A股_${DATE}.md" || echo "_本次未生成_"
            echo ""
            echo "</details>"
            echo ""

            echo "<details><summary>🌐 全球快照</summary>"
            echo ""
            [ -f "reports/market/全球_${DATE}.md" ] && head -n 40 "reports/market/全球_${DATE}.md" || echo "_本次未生成_"
            echo ""
            echo "</details>"
            echo ""

            # --- 股票 ---
            echo "### 📈 股票"
            for f in reports/stocks/*_${DATE}.md; do
              [ -f "$f" ] || continue
              sym=$(basename "$f" | sed "s/_${DATE}.md//")
              echo "#### $sym"
              echo '```text'
              head -n 50 "$f"
              echo '```'
              echo ""
            done

            # --- ETF ---
            echo "### 🧩 ETF"
            for f in reports/etfs/*_${DATE}.md; do
              [ -f "$f" ] || continue
              sym=$(basename "$f" | sed "s/_${DATE}.md//")
              echo "#### $sym"
              echo '```text'
              head -n 40 "$f"
              echo '```'
              echo ""
            done

            # --- 基金 ---
            echo "### 🏦 基金"
            for f in reports/funds/*_${DATE}.md; do
              [ -f "$f" ] || continue
              sym=$(basename "$f" | sed "s/_${DATE}.md//")
              echo "#### $sym"
              echo '```text'
              head -n 40 "$f"
              echo '```'
              echo ""
            done
          } > reports/digest.md
          DIGEST=$(python3 -c 'import sys,json;print(json.dumps(sys.stdin.read()))' < reports/digest.md)
          echo "body=$DIGEST" >> $GITHUB_OUTPUT

      - name: Upload full evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-reports-${{ needs.market-recap.outputs.date }}-${{ needs.market-recap.outputs.runid }}
          path: reports/
          retention-days: 30

      - name: Find or create digest issue
        id: find
        uses: peter-evans/find-issue@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "📈 投研日报（每日自动追加）"
          state: open

      - name: Create issue if missing
        if: steps.find.outputs.issue-number == ''
        uses: peter-evans/create-issue@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "📈 投研日报（每日自动追加）"
          body: |
            # 投研日报

            由 GitHub Actions 自动维护。`young-stock-cli` 每天盘后把摘要**追加**到这条 Issue 的第一条评论里，方便在元宝里做**日环比比对**。

            ## 怎么改自选标的
            仓库 `Settings → Secrets and variables → Actions → Variables` 新建/修改：
            - `STOCK_LIST`：股票代码，逗号分隔
            - `ETF_LIST`：ETF 代码，逗号分隔
            - `FUND_LIST`：场外基金代码，逗号分隔

            修改后下一次运行自动生效，无需改 yaml。

            ## 怎么用（日环比）
            1. 复制**相邻两天**同一标的的摘要段落
            2. 一起发给元宝，用文末给的 prompt
            3. 完整报告见每次 workflow 的 Artifact（保留 30 天）

            > ⚠️ 纯研究工具，非投资建议。缺数据处原样保留，不补零。
            > 🏦 场外基金 NAV 通常晚间更新，盘后 16:00 跑到的可能是估算值。
          labels: research,automated

      - name: Append daily digest
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.find.outputs.issue-number }}
          body: ${{ steps.digest.outputs.body }}
          edit-mode: append
          append-separator: newline

      - name: Failure notice
        if: needs.deep-dive.result == 'failure' || needs.market-recap.result == 'failure'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.find.outputs.issue-number }}
          body: |
            ### ⚠️ ${{ needs.market-recap.outputs.date }} 运行异常
            部分标的分析失败，请查看 workflow log 与 Artifact。
          edit-mode: append
